# Structured expiry deadlines for time-limited advisory exceptions.
# Neither cargo-audit 0.22 nor cargo-deny 0.19.2 supports an `expires` key in
# its native ignore schema, so deadlines are declared here and enforced in
# both Gate 6 and Gate 7 via tools/test_audit_ignore_policy.sh.

[exceptions.RUSTSEC-2026-0534]
expires = "2027-01-31"
tracking_issue = "https://github.com/exochain/exochain/issues/922"
