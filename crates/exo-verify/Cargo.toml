[package]
name = "exochain-verify"
description = "EXOCHAIN offline verifier for AVC trust receipts: signed bytes, audit-chain inclusion, signer identity and RFC 3161 trusted time"
documentation = "https://docs.rs/exochain-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "exo_verify"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
exo-core = { package = "exochain-core", path = "../exo-core", version = "=0.4.0" }
exo-avc = { package = "exochain-avc", path = "../exo-avc", version = "=0.4.0" }
serde = { workspace = true }
ciborium = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
exo-dag = { package = "exochain-dag", path = "../exo-dag", version = "=0.4.0" }
serde_json = { workspace = true }
