[package]
name = "exochain-cgr-methods"
description = "Embedded RISC Zero guest ELF and image id for CGR combinator reduction"
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/exochain/exochain"
publish = false

[workspace]

[lib]
name = "exo_cgr_methods"
path = "src/lib.rs"

[build-dependencies]
risc0-build = "=3.0.5"

[package.metadata.risc0]
methods = ["guest"]
