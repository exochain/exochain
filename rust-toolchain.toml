# Pinned toolchain for local development.
#
# Matches Dockerfile (Rust 1.88) so contributors, CI, and release builds
# all resolve to the same rustc. MSRV remains 1.85 (Cargo.toml workspace.package).
#
# CI intentionally uses dtolnay/rust-toolchain@stable to catch forward
# compatibility issues on newer stable releases; the Dockerfile and this
# file provide deterministic floors for reproducible builds.

[toolchain]
channel = "1.88"
components = ["rustfmt", "clippy"]
profile = "minimal"
