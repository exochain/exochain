              -r "$requirements"
          [ "$(/usr/bin/sha256sum "$requirements" | /usr/bin/cut -d ' ' -f 1)" = "$requirements_sha256" ]
          attestation_cli="$tool_root/bin/pypi-attestations"
          [ -f "$attestation_cli" ] && [ -x "$attestation_cli" ] && [ ! -L "$attestation_cli" ]
          [ "$($attestation_cli --version)" = 'pypi-attestations 0.0.30' ]
          # Rehash both local artifacts after the publisher action/tool setup.
          /usr/bin/env -i "$tool_python" -I -B "$verifier" artifacts \
            "$dist_dir" exochain "$RELEASE_VERSION" --expect-manifest "$manifest"
          registry_verified=false
          for attempt in 1 2 3 4 5 6; do
            /bin/rm -f -- "$registry_response"
            status="$(/usr/bin/curl -q --silent --show-error --output "$registry_response" \
              --write-out '%{http_code}' --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --max-filesize 1048576 \
              "https://pypi.org/pypi/exochain/$RELEASE_VERSION/json")"
            if [ "$status" = 200 ]; then
              /usr/bin/env -i "$tool_python" -I -B "$verifier" registry-response \
                "$registry_response" exochain "$RELEASE_VERSION" "$manifest"
              provenance_available=true
              while IFS=$'\t' read -r filename digest size; do
                [[ "$filename" =~ ^exochain-${RELEASE_VERSION//./\.}(-py3-none-any\.whl|\.tar\.gz)$ ]]
                [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
                [[ "$size" =~ ^[1-9][0-9]*$ ]]
                artifact="$dist_dir/$filename"
                provenance="$provenance_root/$filename.provenance.json"
                provenance_status="$(/usr/bin/curl -q --silent --show-error --output "$provenance" \
                  --write-out '%{http_code}' --proto '=https' --tlsv1.2 \
                  --connect-timeout 15 --max-time 60 --max-filesize 8388608 \
                  --header 'Accept: application/vnd.pypi.integrity.v1+json' \
                  "https://pypi.org/integrity/exochain/$RELEASE_VERSION/$filename/provenance")"
                case "$provenance_status" in
                  200) ;;
                  404) provenance_available=false; break ;;
                  *) echo "PyPI provenance returned unexpected HTTP status $provenance_status" >&2; exit 1 ;;
                esac
                [ "$(/usr/bin/sha256sum "$artifact" | /usr/bin/cut -d ' ' -f 1)" = "$digest" ]
                provenance_sha256="$(/usr/bin/sha256sum "$provenance" | /usr/bin/cut -d ' ' -f 1)"
                [[ "$provenance_sha256" =~ ^[0-9a-f]{64}$ ]]
                /usr/bin/env -i HOME="$tool_home" \
                  "$attestation_cli" verify pypi \
                    --repository https://github.com/exochain/exochain \
                    --provenance-file "$provenance" "$artifact"
                /usr/bin/env -i "$tool_python" -I -B "$verifier" provenance \
                  "$provenance" "$artifact" exochain/exochain release.yml release \
                  "$EXPECTED_WORKFLOW_REF" "$EXPECTED_COMMIT_SHA"
                [ "$(/usr/bin/sha256sum "$artifact" | /usr/bin/cut -d ' ' -f 1)" = "$digest" ]
                [ "$(/usr/bin/sha256sum "$provenance" | /usr/bin/cut -d ' ' -f 1)" = "$provenance_sha256" ]
              done < "$manifest"
              if [ "$provenance_available" = true ]; then
                registry_verified=true
                break
              fi
            fi
            [ "$attempt" -lt 6 ] && /bin/sleep 10
          done
          [ "$registry_verified" = true ] \
            || { echo "PyPI did not expose exact artifacts with complete PEP 740 provenance" >&2; exit 1; }
          [ "$(/usr/bin/sha256sum "$manifest" | /usr/bin/cut -d ' ' -f 1)" = "$RELEASE_EXPECTED_MANIFEST_SHA256" ]
