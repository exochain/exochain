          version = os.environ.get("RELEASE_VERSION", "")
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit("release asset inventory has an invalid version")
          root = Path(os.environ["RELEASE_ASSET_ROOT"])
          crate_names = (
              "exochain-api", "exochain-authority", "exochain-avc", "exochain-catapult",
              "exochain-consensus", "exochain-consent", "exochain-core", "exochain-dag",
              "exochain-dag-db-api", "exochain-dag-db-core", "exochain-dag-db-domain",
              "exochain-dag-db-exchange", "exochain-dag-db-graph", "exochain-dag-db-lab",
              "exochain-dag-db-postgres", "exochain-dag-db-retrieval",
              "exochain-decision-forum", "exochain-economy", "exochain-escalation",
              "exochain-gatekeeper", "exochain-gateway", "exochain-governance",
              "exochain-identity", "exochain-legal", "exochain-messaging", "exochain-node",
              "exochain-pdp", "exochain-proofs", "exochain-root", "exochain-sdk",
              "exochain-tenant", "exochain-wasm",
          )
          expected = {
              f"archives/{target}/exochain-{version}-{target}.tar.gz"
              for target in ("x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu")
          }
          expected.update(f"sbom/exochain-{version}-{name}.cdx.json" for name in crate_names)
          actual: set[str] = set()
          for candidate in root.rglob("*"):
              metadata = candidate.lstat()
              relative = candidate.relative_to(root).as_posix()
              if stat.S_ISDIR(metadata.st_mode):
                  continue
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  raise SystemExit(f"release asset is not a regular file: {relative}")
              if metadata.st_size == 0:
                  raise SystemExit(f"release asset is empty: {relative}")
              actual.add(relative)
          if actual != expected:
              raise SystemExit(
                  f"release asset inventory mismatch; missing={sorted(expected - actual)!r}; "
                  f"extra={sorted(actual - expected)!r}"
              )
          PY

      - name: Reverify source and tag immediately before release creation
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: false
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p

      - name: Create release
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-release-inputs.outputs.tag }}
          target_commitish: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          name: "EXOCHAIN ${{ needs.validate-release-inputs.outputs.tag }}"
          body: |
            ## EXOCHAIN ${{ needs.validate-release-inputs.outputs.tag }}

            Constitutional trust fabric release.

            All CR-001 Section 8.8 quality gates passed:
            - Build: release profile with LTO
            - Tests: full workspace (debug + release)
            - Coverage: scoped 90% line coverage gate
            - Lint: clippy with float_arithmetic deny
            - Format: rustfmt verified
            - Audit: policy-enforced with documented advisory exceptions
            - Deny: license and advisory policy verified
            - Documentation: builds without warnings
            - SBOM: CycloneDX component graph generated
            - npm: WASM and LYNK proxy packages verified and published with provenance

            ### Supply-Chain Verification

            Build provenance is attested via GitHub's SLSA Level 2 pipeline and stored
            in the Sigstore Rekor transparency log. Verify any release archive:

            ```sh
            gh attestation verify exochain-${{ needs.validate-release-inputs.outputs.version }}-<TARGET>.tar.gz \
              --owner exochain
            ```

            CycloneDX SBOMs (`.cdx.json`) are attached below for each publishable release crate.
            They can be ingested by any SBOM-aware toolchain (Dependency-Track, Grype,
            Trivy, etc.).
          files: |
            ${{ runner.temp }}/exochain-release-assets/archives/*/exochain-${{ needs.validate-release-inputs.outputs.version }}-*.tar.gz
            ${{ runner.temp }}/exochain-release-assets/sbom/exochain-${{ needs.validate-release-inputs.outputs.version }}-*.cdx.json
          draft: false
