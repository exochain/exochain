            404) printf 'publish_needed=true\n' >> "$GITHUB_OUTPUT" ;;
            200)
              /usr/bin/env -i "$python_path" -I -B "$verifier" registry-response \
                "$registry_response" exochain "$RELEASE_VERSION" "$trusted_manifest"
              printf 'publish_needed=false\n' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "PyPI returned unexpected HTTP status $status" >&2; exit 1 ;;
