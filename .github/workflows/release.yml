          attestations: true
          skip-existing: false
          print-hash: true
      - name: Strict PyPI digest and PEP 740 provenance readback
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_EXPECTED_MANIFEST_SHA256: ${{ needs.prepare-python-package.outputs.manifest_sha256 }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
        run: |
          set -euo pipefail
          # These immutable inputs were copied from GITHUB_SHA before use.
          artifact_root="$GITHUB_WORKSPACE/python-release-artifact"
          dist_dir="$artifact_root/dist"
          manifest="$RUNNER_TEMP/exochain-python-release-manifest.tsv"
          verifier="$RUNNER_TEMP/exochain-python-release-verifier.py"
          requirements="$RUNNER_TEMP/exochain-python-release-requirements.lock"
          registry_response="$RUNNER_TEMP/exochain-pypi-readback.json"
          provenance_root="$RUNNER_TEMP/exochain-pypi-provenance"
          tool_root="$RUNNER_TEMP/exochain-pypi-attestation-tools"
          tool_home="$RUNNER_TEMP/exochain-pypi-attestation-home"
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$($python_path -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          [[ "$RELEASE_EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(/usr/bin/sha256sum "$manifest" | /usr/bin/cut -d ' ' -f 1)" = "$RELEASE_EXPECTED_MANIFEST_SHA256" ]
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_REF" =~ ^refs/(heads|tags)/[0-9A-Za-z._/-]+$ ]]
          [[ "$EXPECTED_WORKFLOW_REF" != *..* ]]
          /bin/rm -rf -- "$provenance_root" "$tool_root" "$tool_home"
          /bin/rm -f -- "$requirements" "$verifier"
          /bin/mkdir -m 700 -p "$provenance_root" "$tool_home"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/verify_python_release_package.py" > "$verifier"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/python-release-requirements.lock" > "$requirements"
          /bin/chmod 400 "$requirements"
          /bin/chmod 500 "$verifier"
          requirements_sha256="$(/usr/bin/sha256sum "$requirements" | /usr/bin/cut -d ' ' -f 1)"
          [[ "$requirements_sha256" =~ ^[0-9a-f]{64}$ ]]
          /usr/bin/env -i HOME="$tool_home" PIP_CONFIG_FILE=/dev/null \
            "$python_path" -I -B -m venv "$tool_root"
          tool_python="$tool_root/bin/python"
          /usr/bin/env -i HOME="$tool_home" PIP_CONFIG_FILE=/dev/null \
            "$tool_python" -I -B -m pip --isolated install --disable-pip-version-check --no-compile \
