            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          /bin/rm -f -- "$RELEASE_PACKAGE_MANIFEST"
          : > "$RELEASE_NPM_USER_CONFIG"
          : > "$RELEASE_NPM_GLOBAL_CONFIG"
          /bin/chmod 600 "$RELEASE_NPM_USER_CONFIG" "$RELEASE_NPM_GLOBAL_CONFIG"
          [ "$RELEASE_NPM_USER_CONFIG" != "$RELEASE_NPM_GLOBAL_CONFIG" ]
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          transport_archive="$RELEASE_WASM_TRANSPORT_DIR/exochain-wasm-output.tar"
          transport_inventory="$RELEASE_WASM_TRANSPORT_DIR/exochain-wasm-output.inventory"
          expected_transport_files="$(/usr/bin/printf '%s\n' "$transport_archive" "$transport_inventory" | /usr/bin/sort)"
          actual_transport_files="$(/usr/bin/find "$RELEASE_WASM_TRANSPORT_DIR" -mindepth 1 -maxdepth 1 -type f ! -type l -print | /usr/bin/sort)"
          [ "$actual_transport_files" = "$expected_transport_files" ]
          [ "$(/usr/bin/find "$RELEASE_WASM_TRANSPORT_DIR" -mindepth 1 -maxdepth 1 -print | /usr/bin/wc -l | /usr/bin/tr -d ' ')" -eq 2 ]
          [[ "$RELEASE_WASM_TRANSPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          /bin/rm -rf -- "$RELEASE_WASM_RAW_DIR"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
              "${GITHUB_SHA}:tools/transport_wasm_release_output.py" | \
            /usr/bin/env -i "$python_path" -I -B - extract \
              --archive "$transport_archive" \
              --expected-sha256 "$RELEASE_WASM_TRANSPORT_SHA256" \
              --inventory "$transport_inventory" \
              --output-dir "$RELEASE_WASM_RAW_DIR"
          for generated_file in exochain_wasm.d.ts exochain_wasm.js exochain_wasm_bg.wasm; do
            /bin/cp -- "$RELEASE_WASM_RAW_DIR/$generated_file" "$RELEASE_NPM_PACKAGE_DIR/$generated_file"
          done
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
              "${GITHUB_SHA}:packages/exochain-wasm/wasm/package.json" > "$RELEASE_NPM_PACKAGE_DIR/package.json"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
              "${GITHUB_SHA}:packages/exochain-wasm/wasm/LICENSE" > "$RELEASE_NPM_PACKAGE_DIR/LICENSE"
          resolver="$RUNNER_TEMP/exochain-wasm-pack-resolver.sh"
          verify_script="$RUNNER_TEMP/exochain-verify-wasm-pack.mjs"
          tarball_guard="$RUNNER_TEMP/exochain-verify-wasm-tarball.py"
          /bin/rm -f -- "$resolver" "$verify_script" "$tarball_guard"
          for helper_spec in \
            "tools/resolve_release_tool_path.sh:$resolver" \
            "tools/verify_npm_release_package.mjs:$verify_script" \
            "tools/verify_npm_release_tarball.py:$tarball_guard"; do
            helper_source="${helper_spec%%:*}"
            helper_target="${helper_spec#*:}"
            /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
                "${GITHUB_SHA}:$helper_source" > "$helper_target"
          done
          trusted_identity="$(/usr/bin/env -i \
              RUNNER_TEMP="$RUNNER_TEMP" RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
              RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
              /bin/bash --noprofile --norc -p "$resolver" --identity node npm bash tar)"
          fresh_path="$(/usr/bin/env -i \
              RUNNER_TEMP="$RUNNER_TEMP" RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
              RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
              /bin/bash --noprofile --norc -p "$resolver" node npm bash tar)"
          fresh_view="${fresh_path%%:*}"
          [ "$(/bin/cat "$fresh_view/.release-tool-identity")" = "$trusted_identity" ]
          node_path="$(/usr/bin/realpath "$fresh_view/node")"
          npm_path="$(/usr/bin/realpath "$fresh_view/npm")"
          [ "$(/usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
              NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
              NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
              "$npm_path" --version)" = 10.9.2 ]
          /usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
            RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_PACKAGE_MANIFEST_OUTPUT="$RELEASE_PACKAGE_MANIFEST" \
            "$node_path" "$verify_script" wasm "$RELEASE_NPM_PACKAGE_DIR"
          cd /
          pack_json="$(/usr/bin/env -i \
              PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
              NPM_CONFIG_CACHE="$RELEASE_NPM_HOME/cache" \
              NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
              NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org NPM_CONFIG_IGNORE_SCRIPTS=true \
              "$npm_path" pack "$RELEASE_NPM_PACKAGE_DIR" --json \
                --pack-destination "$RELEASE_NPM_PACK_DIR" --ignore-scripts \
                --registry=https://registry.npmjs.org)"
          tarball_name="$(printf '%s' "$pack_json" | /usr/bin/env -i "$node_path" \
            -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(0,"utf8"));if(!Array.isArray(p)||p.length!==1||typeof p[0].filename!=="string")process.exit(1);process.stdout.write(p[0].filename)')"
          [ "$tarball_name" = "exochain-exochain-wasm-$RELEASE_VERSION.tgz" ] \
            || { echo "Unexpected WASM tarball name: $tarball_name" >&2; exit 1; }
          release_tarball="$RELEASE_NPM_PACK_DIR/$tarball_name"
          [ -f "$release_tarball" ] && [ ! -L "$release_tarball" ]
          /bin/rm -rf -- "$RELEASE_NPM_EXTRACT_DIR"
          /usr/bin/env -i "$python_path" -I -B "$tarball_guard" \
            "$release_tarball" "$RELEASE_NPM_EXTRACT_DIR"
          /usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
            RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_EXPECTED_PACKAGE_MANIFEST="$RELEASE_PACKAGE_MANIFEST" \
            "$node_path" "$verify_script" wasm "$RELEASE_NPM_EXTRACT_DIR/package"
          tarball_sha256="$(/usr/bin/sha256sum "$release_tarball" | /usr/bin/cut -d ' ' -f 1)"
          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload exact WASM npm package
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-wasm-npm-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-wasm-pack/${{ steps.pack-wasm.outputs.tarball_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publish LYNK LLM proxy package to npm (unless dry run)
  # -----------------------------------------------------------------------
  test-llm-proxy-npm:
    name: "Test LYNK npm package"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      transport_sha256: ${{ steps.transport-llm.outputs.transport_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote release tag identity
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""

      - name: Reverify source and tag immediately before LYNK lifecycle
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p

      - name: Install, test, and build LYNK package from captured source
        id: transport-llm
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_NPM_HOME: ${{ runner.temp }}/exochain-llm-lifecycle-home
          RELEASE_NPM_USER_CONFIG: ${{ runner.temp }}/exochain-llm-lifecycle-home/user.npmrc
          RELEASE_NPM_GLOBAL_CONFIG: ${{ runner.temp }}/exochain-llm-lifecycle-home/global.npmrc
          RELEASE_LLM_SOURCE_ROOT: ${{ runner.temp }}/exochain-llm-source
          RELEASE_LLM_PACKAGE_DIR: ${{ runner.temp }}/exochain-llm-source/packages/exochain-llm-proxy
          RELEASE_LLM_TRANSPORT_ARCHIVE: ${{ runner.temp }}/exochain-llm-dist.tar
          RELEASE_LLM_TRANSPORT_INVENTORY: ${{ runner.temp }}/exochain-llm-dist.inventory
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
        run: |
          set -euo pipefail
          for clean_directory in "$RELEASE_NPM_HOME" "$RELEASE_LLM_SOURCE_ROOT"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          : > "$RELEASE_NPM_USER_CONFIG"
          : > "$RELEASE_NPM_GLOBAL_CONFIG"
          /bin/chmod 600 "$RELEASE_NPM_USER_CONFIG" "$RELEASE_NPM_GLOBAL_CONFIG"
          [ "$RELEASE_NPM_USER_CONFIG" != "$RELEASE_NPM_GLOBAL_CONFIG" ]

          # Capture validation code and immutable package source before npm can
          # execute repository tests or build scripts. No later step reads Git.
          # shellcheck source=tools/capture_release_helper.sh
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/verify_npm_release_package.mjs verify_program
          capture_release_helper tools/transport_release_file_set.py transport_program
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          /usr/bin/env -i \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" archive \
              --format=tar "$GITHUB_SHA" packages/exochain-llm-proxy | \
            /usr/bin/env -i TAR_OPTIONS= /usr/bin/tar -xf - \
              -C "$RELEASE_LLM_SOURCE_ROOT"
          [ -d "$RELEASE_LLM_PACKAGE_DIR" ] && [ ! -L "$RELEASE_LLM_PACKAGE_DIR" ]

          tool_identity="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p -s -- --identity \
              node npm bash tar <<<"$resolver_program")"
          trusted_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p -s -- \
              node npm bash tar <<<"$resolver_program")"
          trusted_view="${trusted_path%%:*}"
          [ "$(/bin/cat "$trusted_view/.release-tool-identity")" = "$tool_identity" ]
          node_path="$(/usr/bin/realpath "$trusted_view/node")"
          npm_path="$(/usr/bin/realpath "$trusted_view/npm")"
          [ "$(/usr/bin/env -i PATH="$trusted_path" HOME="$RELEASE_NPM_HOME" \
              NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
              NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
              "$npm_path" --version)" = 10.9.2 ]

          printf '%s' "$verify_program" | /usr/bin/env -i \
            PATH="$trusted_path" \
            HOME="$RELEASE_NPM_HOME" \
            RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            "$node_path" --input-type=module - \
              llm-source "$RELEASE_LLM_PACKAGE_DIR"

          # The immutable archive deliberately contains the reviewed dist tree,
          # so remove it before any lifecycle command can preserve stale bytes.
          # Tests get their own clean compiler output tree as well.
          /bin/rm -rf -- \
            "$RELEASE_LLM_PACKAGE_DIR/dist" \
            "$RELEASE_LLM_PACKAGE_DIR/dist-test"
          [ ! -e "$RELEASE_LLM_PACKAGE_DIR/dist" ] && [ ! -L "$RELEASE_LLM_PACKAGE_DIR/dist" ]
          [ ! -e "$RELEASE_LLM_PACKAGE_DIR/dist-test" ] && [ ! -L "$RELEASE_LLM_PACKAGE_DIR/dist-test" ]
          cd "$RELEASE_LLM_PACKAGE_DIR"
          /usr/bin/env -i \
            PATH="$trusted_path" \
            HOME="$RELEASE_NPM_HOME" \
            NPM_CONFIG_CACHE="$RELEASE_NPM_HOME/cache" \
            NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
            NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$npm_path" ci --ignore-scripts --registry=https://registry.npmjs.org

          /usr/bin/env -i \
            PATH="$trusted_path" \
            HOME="$RELEASE_NPM_HOME" \
            NPM_CONFIG_CACHE="$RELEASE_NPM_HOME/cache" \
            NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
            NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$npm_path" run test:coverage

          # Test scripts are untrusted lifecycle code and could recreate an
          # allowed dist filename. Build the transported release bytes only
          # after removing both compiler output trees again.
          /bin/rm -rf -- \
            "$RELEASE_LLM_PACKAGE_DIR/dist" \
            "$RELEASE_LLM_PACKAGE_DIR/dist-test"
          [ ! -e "$RELEASE_LLM_PACKAGE_DIR/dist" ] && [ ! -L "$RELEASE_LLM_PACKAGE_DIR/dist" ]
          [ ! -e "$RELEASE_LLM_PACKAGE_DIR/dist-test" ] && [ ! -L "$RELEASE_LLM_PACKAGE_DIR/dist-test" ]
          /usr/bin/env -i \
            PATH="$trusted_path" \
            HOME="$RELEASE_NPM_HOME" \
            NPM_CONFIG_CACHE="$RELEASE_NPM_HOME/cache" \
            NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
            NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$npm_path" run build

          /bin/rm -f -- "$RELEASE_LLM_TRANSPORT_ARCHIVE" "$RELEASE_LLM_TRANSPORT_INVENTORY"
          transport_sha256="$(printf '%s' "$transport_program" | \
            /usr/bin/env -i "$python_path" -I -B - create \
              --profile llm-dist --version "$RELEASE_VERSION" \
              --input-dir "$RELEASE_LLM_PACKAGE_DIR/dist" \
              --archive "$RELEASE_LLM_TRANSPORT_ARCHIVE" \
              --inventory "$RELEASE_LLM_TRANSPORT_INVENTORY")"
          [[ "$transport_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'transport_sha256=%s\n' "$transport_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload untrusted LYNK tested-dist transport
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-llm-dist-${{ needs.validate-release-inputs.outputs.version }}
          path: |
            ${{ runner.temp }}/exochain-llm-dist.tar
            ${{ runner.temp }}/exochain-llm-dist.inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


  prepare-llm-proxy-npm:
    name: "Prepare exact LYNK npm package on fresh runner"
    runs-on: ubuntu-24.04
    needs: [test-llm-proxy-npm, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      tarball_name: ${{ steps.pack-llm.outputs.tarball_name }}
