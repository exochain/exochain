          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          trusted_identity="$(
            /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/resolve_release_tool_path.sh" | \
              /usr/bin/env -i \
                RUNNER_TEMP="$RUNNER_TEMP" \
                RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
                RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
                RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
                /bin/bash --noprofile --norc -p -s -- --identity cargo bash tar git curl
          )"
          printf 'identity=%s\n' "$trusted_identity" >> "$GITHUB_OUTPUT"
      - name: Reproduce exact crate archives without registry credentials
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          TRUSTED_RELEASE_TOOL_IDENTITY: ${{ steps.trusted-tools.outputs.identity }}
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
          RELEASE_CARGO_HOME: ${{ runner.temp }}/exochain-crate-reproduce-cargo-home
          RELEASE_TOOL_HOME: ${{ runner.temp }}/exochain-crate-reproduce-home
          RELEASE_TARGET_DIR: ${{ runner.temp }}/exochain-crate-reproduction-output
          RELEASE_CRATE_MANIFEST: ${{ runner.temp }}/exochain-crate-reproduction-output/exochain-crate-reproduced.tsv
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          DRY_RUN: false
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TRUSTED_PYTHON_VERSION: 3.13.7
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/exochain-crate-reproduce-resolver.sh"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
              "${GITHUB_SHA}:tools/resolve_release_tool_path.sh" > "$resolver"
          fresh_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            /bin/bash --noprofile --norc -p "$resolver" cargo bash tar git curl)"
          [ "$(/bin/cat "${fresh_path%%:*}/.release-tool-identity")" = "$TRUSTED_RELEASE_TOOL_IDENTITY" ]
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/preflight_release_crates.sh" | \
            /usr/bin/env -i \
              DRY_RUN=false \
              EXPECTED_COMMIT_SHA="$EXPECTED_COMMIT_SHA" \
              EXPECTED_TAG_COMMIT_SHA="$EXPECTED_TAG_COMMIT_SHA" \
              EXPECTED_TAG_OBJECT_SHA="$EXPECTED_TAG_OBJECT_SHA" \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
              GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              RELEASE_CARGO_HOME="$RELEASE_CARGO_HOME" \
              RELEASE_CRATE_MANIFEST="$RELEASE_CRATE_MANIFEST" \
              RELEASE_GITHUB_TOKEN="$RELEASE_GITHUB_TOKEN" RELEASE_TAG="$RELEASE_TAG" \
              RELEASE_TARGET_DIR="$RELEASE_TARGET_DIR" RELEASE_TOOL_HOME="$RELEASE_TOOL_HOME" \
              RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
              RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
              RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              RELEASE_PYTHON="$RELEASE_PYTHON" \
              RELEASE_TRUSTED_PYTHON_ROOT="$RELEASE_TRUSTED_PYTHON_ROOT" \
              RELEASE_TRUSTED_PYTHON_VERSION="$RELEASE_TRUSTED_PYTHON_VERSION" \
              RELEASE_VERSION="$RELEASE_VERSION" RUNNER_TEMP="$RUNNER_TEMP" \
              TRUSTED_RELEASE_PATH="$fresh_path" TRUSTED_RELEASE_REF="$TRUSTED_RELEASE_REF" \
              /bin/bash --noprofile --norc -p
          /usr/bin/cmp -s \
            "$RUNNER_TEMP/crate-preflight/exochain-crate-preflight.tsv" \
            "$RELEASE_CRATE_MANIFEST" \
            || { echo "Reproduced crate manifest differs from token-free preflight." >&2; exit 1; }
          while IFS=$'\t' read -r crate version _archive_hash _member_hash; do
            /usr/bin/cmp -s \
              "$RUNNER_TEMP/crate-preflight/package/${crate}-${version}.crate" \
              "$RELEASE_TARGET_DIR/package/${crate}-${version}.crate" \
              || { echo "Reproduced ${crate} archive differs from token-free preflight." >&2; exit 1; }
          done < "$RELEASE_CRATE_MANIFEST"
      - name: Upload independently reproduced crate archives and manifest
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crate-reproduction-${{ needs.validate-release-inputs.outputs.version }}
          path: |
            ${{ runner.temp }}/exochain-crate-reproduction-output/exochain-crate-reproduced.tsv
            ${{ runner.temp }}/exochain-crate-reproduction-output/package/*.crate
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # -----------------------------------------------------------------------
  # Publish from a fresh runner after both independent package reproductions,
  # npm preparation, and attestation. No repository lifecycle has executed in
  # this job. Every helper is captured and verified before the first mutation.
  # -----------------------------------------------------------------------
  publish:
    name: "Publish Exact crates.io Candidates"
    runs-on: ubuntu-24.04
    environment: release
    needs:
      - reproduce-crates
      - prepare-wasm-npm
      - prepare-llm-proxy-npm
      - prepare-sdk-npm
      - prepare-python-package
      - attest-release
      - verify-signed-tag
      - validate-release-inputs
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fresh publisher source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify fresh publisher remote tag identity
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: false
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - name: Download token-free crate preflight manifest
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crate-preflight-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/crate-preflight
      - name: Download independent crate reproduction archives and manifest
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crate-reproduction-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/crate-reproduction
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Validate ownership and publish without post-mutation Git reads
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TRUSTED_PYTHON_VERSION: 3.13.7
          RELEASE_CRATE_ARCHIVE_DIR: ${{ runner.temp }}/crate-preflight/package
          RELEASE_TOOL_HOME: ${{ runner.temp }}/exochain-crate-publish-home
          RELEASE_PREFLIGHT_MANIFEST: ${{ runner.temp }}/crate-preflight/exochain-crate-preflight.tsv
          RELEASE_REPRODUCED_MANIFEST: ${{ runner.temp }}/crate-reproduction/exochain-crate-reproduced.tsv
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          EXOCHAIN_CRATES_IO_ALLOWED_OWNERS: ${{ vars.EXOCHAIN_CRATES_IO_ALLOWED_OWNERS }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=tools/capture_release_helper.sh
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/publish_release_crates.sh publisher_program
          capture_release_helper tools/publish_sealed_crate.py sealed_crate_publisher_program
          capture_release_helper tools/check_cratesio_namespace_ownership.mjs owner_checker_program
          capture_release_helper tools/verify_release_source.sh source_guard_program
          capture_release_helper tools/verify_release_tag.sh tag_guard_program
          live_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p -s -- \
              node bash tar git curl <<<"$resolver_program")"
          printf '%s' "$publisher_program" | /usr/bin/env -i \
            BASH_ENV=/dev/null \
            CARGO_REGISTRY_TOKEN="$CARGO_REGISTRY_TOKEN" \
            EXPECTED_COMMIT_SHA="$EXPECTED_COMMIT_SHA" \
            EXPECTED_TAG_COMMIT_SHA="$EXPECTED_TAG_COMMIT_SHA" \
            EXPECTED_TAG_OBJECT_SHA="$EXPECTED_TAG_OBJECT_SHA" \
            EXOCHAIN_CRATES_IO_ALLOWED_OWNERS="$EXOCHAIN_CRATES_IO_ALLOWED_OWNERS" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RELEASE_CRATE_ARCHIVE_DIR="$RELEASE_CRATE_ARCHIVE_DIR" \
            RELEASE_GITHUB_TOKEN="$RELEASE_GITHUB_TOKEN" \
            RELEASE_OWNER_CHECK_PROGRAM="$owner_checker_program" \
            RELEASE_PREFLIGHT_MANIFEST="$RELEASE_PREFLIGHT_MANIFEST" \
            RELEASE_PYTHON="$RELEASE_PYTHON" \
            RELEASE_REPRODUCED_MANIFEST="$RELEASE_REPRODUCED_MANIFEST" \
            RELEASE_SEALED_CRATE_PUBLISHER_PROGRAM="$sealed_crate_publisher_program" \
            RELEASE_SOURCE_GUARD_PROGRAM="$source_guard_program" \
            RELEASE_TAG="$RELEASE_TAG" RELEASE_TAG_GUARD_PROGRAM="$tag_guard_program" \
            RELEASE_TEMP_ROOT="$RUNNER_TEMP" \
            RELEASE_TOOL_HOME="$RELEASE_TOOL_HOME" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            RELEASE_TRUSTED_PYTHON_ROOT="$RELEASE_TRUSTED_PYTHON_ROOT" \
            RELEASE_TRUSTED_PYTHON_VERSION="$RELEASE_TRUSTED_PYTHON_VERSION" \
            RELEASE_VERSION="$RELEASE_VERSION" RUNNER_TEMP="$RUNNER_TEMP" \
            TRUSTED_RELEASE_PATH="$live_path" TRUSTED_RELEASE_REF="$TRUSTED_RELEASE_REF" \
            /bin/bash --noprofile --norc -p

  install-wasm-pack:
    name: "Build isolated wasm-pack tool transport"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    permissions: {}
    outputs:
      archive_sha256: ${{ steps.seal-tool.outputs.archive_sha256 }}
    steps:
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Install and seal wasm-pack without repository access
        id: seal-tool
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_INSTALL_ROOT: ${{ runner.temp }}/isolated-wasm-pack-install
          RELEASE_INSTALL_CARGO_HOME: ${{ runner.temp }}/isolated-wasm-pack-cargo-home
          RELEASE_INSTALL_TARGET: ${{ runner.temp }}/isolated-wasm-pack-target
          RELEASE_INSTALL_HOME: ${{ runner.temp }}/isolated-wasm-pack-home
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TOOL_ARCHIVE: ${{ runner.temp }}/wasm-pack-0.14.0.tar
          RELEASE_TOOL_INVENTORY: ${{ runner.temp }}/wasm-pack-0.14.0.inventory
        run: |
          set -euo pipefail
          for clean_directory in "$RELEASE_INSTALL_ROOT" "$RELEASE_INSTALL_CARGO_HOME" "$RELEASE_INSTALL_TARGET" "$RELEASE_INSTALL_HOME"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          /bin/rm -f -- "$RELEASE_TOOL_ARCHIVE" "$RELEASE_TOOL_INVENTORY"
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          cargo_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 cargo)"
          rustc_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 rustc)"
          rustdoc_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 rustdoc)"
          /usr/bin/env -i \
            HOME="$RELEASE_INSTALL_HOME" CARGO_HOME="$RELEASE_INSTALL_CARGO_HOME" \
            CARGO_INSTALL_ROOT="$RELEASE_INSTALL_ROOT" CARGO_TARGET_DIR="$RELEASE_INSTALL_TARGET" \
            RUSTUP_HOME=/home/runner/.rustup RUSTUP_TOOLCHAIN=1.97.1 \
            RUSTC="$rustc_path" RUSTDOC="$rustdoc_path" RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= \
            CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$cargo_path" install wasm-pack --version 0.14.0 --locked \
              --force --root "$RELEASE_INSTALL_ROOT"
          [ "$(/usr/bin/env -i "$RELEASE_INSTALL_ROOT/bin/wasm-pack" --version)" = "wasm-pack 0.14.0" ]
          archive_sha="$(/usr/bin/env -i "$python_path" -I -B - \
            "$RELEASE_INSTALL_ROOT/bin" wasm-pack wasm-pack 0.14.0 \
            "$RELEASE_TOOL_ARCHIVE" "$RELEASE_TOOL_INVENTORY" <<'PY'
          import hashlib
          import io
          import os
          import stat
          import sys
          import tarfile

          input_dir, name, profile, version, archive_path, inventory_path = sys.argv[1:]
          flags = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK
          directory = os.open(input_dir, flags | os.O_DIRECTORY)
          try:
              if os.listdir(directory) != [name]:
                  raise SystemExit("isolated tool bin directory has an unexpected inventory")
              descriptor = os.open(name, flags, dir_fd=directory)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size <= 0 or before.st_size > 64 * 1024 * 1024:
                      raise SystemExit("installed tool must be one bounded regular non-hardlinked file")
                  payload = b""
                  while len(payload) < before.st_size:
                      chunk = os.read(descriptor, min(1024 * 1024, before.st_size - len(payload)))
                      if not chunk:
                          raise SystemExit("installed tool was truncated")
                      payload += chunk
                  after = os.fstat(descriptor)
                  stable = lambda value: (value.st_dev, value.st_ino, value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
                  if stable(before) != stable(after):
                      raise SystemExit("installed tool changed while it was read")
              finally:
                  os.close(descriptor)
          finally:
              os.close(directory)
          output = io.BytesIO()
          with tarfile.open(fileobj=output, mode="w", format=tarfile.USTAR_FORMAT) as bundle:
              member = tarfile.TarInfo(name)
              member.type = tarfile.REGTYPE
              member.mode = 0o755
              member.uid = member.gid = member.mtime = 0
              member.uname = member.gname = member.linkname = ""
              member.pax_headers = {}
              member.size = len(payload)
              bundle.addfile(member, io.BytesIO(payload))
          archive = output.getvalue()
          archive_sha = hashlib.sha256(archive).hexdigest()
          inventory = b"\0".join([
              b"EXOCHAIN-RELEASE-FILE-SET-V1", b"profile", profile.encode(),
              b"artifact-version", version.encode(), b"archive-sha256", archive_sha.encode(),
              b"archive-size", str(len(archive)).encode(), b"file", name.encode(),
              str(len(payload)).encode(), hashlib.sha256(payload).hexdigest().encode(), b"end", b"",
          ])
          for path, data in ((archive_path, archive), (inventory_path, inventory)):
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW, 0o600)
              try:
                  offset = 0
                  while offset < len(data):
                      offset += os.write(descriptor, data[offset:])
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
          print(archive_sha)
          PY
          )"
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
