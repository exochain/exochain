      - name: Publish exact Python artifacts with PyPI Trusted Publishing
        if: ${{ steps.pypi-preflight.outputs.publish_needed == 'true' }}
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
