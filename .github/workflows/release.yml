          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
