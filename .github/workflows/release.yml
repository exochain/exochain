      - name: Rebind exact source and tag immediately before PyPI mutation
        if: ${{ steps.pypi-preflight.outputs.publish_needed == 'true' }}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
