          path: ${{ runner.temp }}/exochain-release-output-input-${{ matrix.target }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Reverify source and tag immediately before fresh artifact packaging
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
      - name: Validate transport and package exact release archive
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_TRANSPORT_DIR: ${{ runner.temp }}/exochain-release-output-input-${{ matrix.target }}
          RELEASE_TRANSPORT_ARCHIVE: ${{ runner.temp }}/exochain-release-output-input-${{ matrix.target }}/exochain-release-output-${{ matrix.target }}.tar
          RELEASE_TRANSPORT_INVENTORY: ${{ runner.temp }}/exochain-release-output-input-${{ matrix.target }}/exochain-release-output-${{ matrix.target }}.inventory
          RELEASE_EXPECTED_TRANSPORT_SHA256: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && needs.release-build.outputs.x86_64_sha256 || needs.release-build.outputs.aarch64_sha256 }}
          RELEASE_DIST_DIR: ${{ runner.temp }}/exochain-release-dist-${{ matrix.target }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/exochain-${{ needs.validate-release-inputs.outputs.version }}-${{ matrix.target }}.tar.gz
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
        run: |
          set -euo pipefail
          case "$RELEASE_TRANSPORT_DIR" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
          case "$RELEASE_DIST_DIR" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          expected_transport_files="$(/usr/bin/printf '%s\n' \
            "$RELEASE_TRANSPORT_ARCHIVE" "$RELEASE_TRANSPORT_INVENTORY" | /usr/bin/sort)"
          actual_transport_files="$(/usr/bin/find "$RELEASE_TRANSPORT_DIR" -mindepth 1 -maxdepth 1 -type f ! -type l -print | /usr/bin/sort)"
          [ "$actual_transport_files" = "$expected_transport_files" ]
          [ "$(/usr/bin/find "$RELEASE_TRANSPORT_DIR" -mindepth 1 -maxdepth 1 -print | /usr/bin/wc -l | /usr/bin/tr -d ' ')" -eq 2 ]
          [[ "$RELEASE_EXPECTED_TRANSPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          /bin/rm -rf -- "$RELEASE_DIST_DIR"
          /bin/mkdir -m 700 -p "$RELEASE_DIST_DIR"
          /bin/rm -f -- "$RELEASE_ARCHIVE"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
              "${GITHUB_SHA}:tools/transport_release_build_output.py" | \
            /usr/bin/env -i "$python_path" -I -B - extract \
              --archive "$RELEASE_TRANSPORT_ARCHIVE" \
              --expected-sha256 "$RELEASE_EXPECTED_TRANSPORT_SHA256" \
              --inventory "$RELEASE_TRANSPORT_INVENTORY" \
              --output-dir "$RELEASE_DIST_DIR"
          /usr/bin/env -i \
            TAR_OPTIONS= GZIP= XZ_OPT= BZIP2= POSIXLY_CORRECT= \
            /usr/bin/tar --sort=name --mtime=@0 --owner=0 --group=0 \
              --numeric-owner --format=ustar -cf - -C "$RELEASE_DIST_DIR" . | \
            /usr/bin/env -i /usr/bin/gzip -n > "$RELEASE_ARCHIVE"
          [ -s "$RELEASE_ARCHIVE" ] && [ ! -L "$RELEASE_ARCHIVE" ]
      - name: Upload exact release archive
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-${{ needs.validate-release-inputs.outputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/exochain-${{ needs.validate-release-inputs.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Generate the release SBOM without registry credentials or OIDC authority.
  #
  # Replaces the previous hand-rolled provenance.json with:
  #   1. CycloneDX SBOM (cargo-cyclonedx) — machine-readable component graph
  #   2. SLSA Level 2 build provenance (actions/attest-build-provenance) —
  #      cryptographically signed via GitHub OIDC / Sigstore keyless flow,
  #      stored in Rekor transparency log for non-repudiation.
  #
  # Verify after release:
  #   gh attestation verify exochain-<VERSION>-<TARGET>.tar.gz \
  #     --owner exochain
  # -----------------------------------------------------------------------
  install-cargo-cyclonedx:
    name: "Build isolated cargo-cyclonedx tool transport"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    if: ${{ !inputs.dry_run }}
    permissions: {}
    outputs:
      archive_sha256: ${{ steps.seal-tool.outputs.archive_sha256 }}
    steps:
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Install and seal cargo-cyclonedx without repository access
        id: seal-tool
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_INSTALL_ROOT: ${{ runner.temp }}/isolated-cargo-cyclonedx-install
          RELEASE_INSTALL_CARGO_HOME: ${{ runner.temp }}/isolated-cargo-cyclonedx-cargo-home
          RELEASE_INSTALL_TARGET: ${{ runner.temp }}/isolated-cargo-cyclonedx-target
          RELEASE_INSTALL_HOME: ${{ runner.temp }}/isolated-cargo-cyclonedx-home
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TOOL_ARCHIVE: ${{ runner.temp }}/cargo-cyclonedx-0.5.9.tar
          RELEASE_TOOL_INVENTORY: ${{ runner.temp }}/cargo-cyclonedx-0.5.9.inventory
        run: |
          set -euo pipefail
          for clean_directory in "$RELEASE_INSTALL_ROOT" "$RELEASE_INSTALL_CARGO_HOME" "$RELEASE_INSTALL_TARGET" "$RELEASE_INSTALL_HOME"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          /bin/rm -f -- "$RELEASE_TOOL_ARCHIVE" "$RELEASE_TOOL_INVENTORY"
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          cargo_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 cargo)"
          rustc_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 rustc)"
          rustdoc_path="$(/home/runner/.cargo/bin/rustup which --toolchain 1.97.1 rustdoc)"
          /usr/bin/env -i \
            HOME="$RELEASE_INSTALL_HOME" \
            CARGO_HOME="$RELEASE_INSTALL_CARGO_HOME" \
            CARGO_INSTALL_ROOT="$RELEASE_INSTALL_ROOT" \
            CARGO_TARGET_DIR="$RELEASE_INSTALL_TARGET" \
            RUSTUP_HOME=/home/runner/.rustup \
            RUSTUP_TOOLCHAIN=1.97.1 \
            RUSTC="$rustc_path" RUSTDOC="$rustdoc_path" \
            RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= \
            CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$cargo_path" install cargo-cyclonedx --version 0.5.9 --locked \
              --force --root "$RELEASE_INSTALL_ROOT"
          [ "$(/usr/bin/env -i \
              PATH="$RELEASE_INSTALL_ROOT/bin:/usr/bin:/bin" \
              HOME="$RELEASE_INSTALL_HOME" CARGO_HOME="$RELEASE_INSTALL_CARGO_HOME" \
              RUSTUP_HOME=/home/runner/.rustup RUSTUP_TOOLCHAIN=1.97.1 \
              "$cargo_path" cyclonedx --version)" = "cargo-cyclonedx-cyclonedx 0.5.9" ]
          archive_sha="$(/usr/bin/env -i "$python_path" -I -B - \
            "$RELEASE_INSTALL_ROOT/bin" cargo-cyclonedx cargo-cyclonedx 0.5.9 \
            "$RELEASE_TOOL_ARCHIVE" "$RELEASE_TOOL_INVENTORY" <<'PY'
          import hashlib
          import io
          import os
          import stat
          import sys
          import tarfile

          input_dir, name, profile, version, archive_path, inventory_path = sys.argv[1:]
          flags = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK
          directory = os.open(input_dir, flags | os.O_DIRECTORY)
          try:
              if os.listdir(directory) != [name]:
                  raise SystemExit("isolated tool bin directory has an unexpected inventory")
              descriptor = os.open(name, flags, dir_fd=directory)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size <= 0 or before.st_size > 64 * 1024 * 1024:
                      raise SystemExit("installed tool must be one bounded regular non-hardlinked file")
                  chunks = []
                  remaining = before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(1024 * 1024, remaining))
                      if not chunk:
                          raise SystemExit("installed tool was truncated")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  payload = b"".join(chunks)
                  after = os.fstat(descriptor)
                  stable = lambda value: (value.st_dev, value.st_ino, value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
                  if stable(before) != stable(after):
                      raise SystemExit("installed tool changed while it was read")
              finally:
                  os.close(descriptor)
          finally:
              os.close(directory)
          output = io.BytesIO()
          with tarfile.open(fileobj=output, mode="w", format=tarfile.USTAR_FORMAT) as bundle:
              member = tarfile.TarInfo(name)
              member.type = tarfile.REGTYPE
              member.mode = 0o755
              member.uid = member.gid = member.mtime = 0
              member.uname = member.gname = member.linkname = ""
              member.pax_headers = {}
              member.size = len(payload)
              bundle.addfile(member, io.BytesIO(payload))
          archive = output.getvalue()
          archive_sha = hashlib.sha256(archive).hexdigest()
          inventory = b"\0".join([
              b"EXOCHAIN-RELEASE-FILE-SET-V1", b"profile", profile.encode(),
              b"artifact-version", version.encode(), b"archive-sha256", archive_sha.encode(),
              b"archive-size", str(len(archive)).encode(), b"file", name.encode(),
              str(len(payload)).encode(), hashlib.sha256(payload).hexdigest().encode(), b"end", b"",
          ])
          for path, data in ((archive_path, archive), (inventory_path, inventory)):
              output_descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW, 0o600)
              try:
                  offset = 0
                  while offset < len(data):
                      offset += os.write(output_descriptor, data[offset:])
                  os.fsync(output_descriptor)
              finally:
                  os.close(output_descriptor)
          print(archive_sha)
          PY
          )"
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'archive_sha256=%s\n' "$archive_sha" >> "$GITHUB_OUTPUT"
      - name: Upload exact cargo-cyclonedx tool transport
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-cyclonedx-tool-0.5.9
          path: |
            ${{ runner.temp }}/cargo-cyclonedx-0.5.9.tar
            ${{ runner.temp }}/cargo-cyclonedx-0.5.9.inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  generate-sbom:
    name: "Generate Release SBOM"
    runs-on: ubuntu-24.04
    needs: [install-cargo-cyclonedx, verify-signed-tag, validate-release-inputs]
    if: ${{ !inputs.dry_run }}
    permissions:
