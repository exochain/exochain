          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$($python_path -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          [[ "$RELEASE_EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(/usr/bin/sha256sum "$manifest" | /usr/bin/cut -d ' ' -f 1)" = "$RELEASE_EXPECTED_MANIFEST_SHA256" ]
          /usr/bin/install -m 400 "$manifest" "$trusted_manifest"
          [ "$(/usr/bin/sha256sum "$trusted_manifest" | /usr/bin/cut -d ' ' -f 1)" = "$RELEASE_EXPECTED_MANIFEST_SHA256" ]
          /usr/bin/env -i "$python_path" -I -B "$verifier" artifacts \
