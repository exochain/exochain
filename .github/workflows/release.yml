# EXOCHAIN Release Workflow
#
# Routes through the release environment after all CI gates pass.
# Repository settings determine whether approval is required.
# Non-dry-run releases must be anchored to an existing signed tag.
# Produces deterministic release artifacts with CycloneDX SBOMs and SLSA attestations.

name: EXOCHAIN Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (skip publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

defaults:
  run:
    shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}

jobs:
  # -----------------------------------------------------------------------
  # Run full CI pipeline first
  # -----------------------------------------------------------------------
  ci:
    name: "Run CI Pipeline"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # -----------------------------------------------------------------------
  # Validate untrusted workflow-dispatch inputs before release jobs consume them
  # -----------------------------------------------------------------------
  validate-release-inputs:
    name: "Validate Release Inputs"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      trusted_ref: ${{ steps.validate.outputs.trusted_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        id: validate
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          TRUSTED_RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION_INPUT"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z][0-9A-Za-z-]*)*)?$ ]]; then
            echo "Invalid release version: expected major.minor.patch with optional prerelease suffix." >&2
            exit 1
          fi
          /bin/bash --noprofile --norc -p tools/verify_release_source.sh
          head_sha="$(git rev-parse HEAD)"
          RELEASE_VERSION_EXPECTED="$version" bash tools/test_release_version_alignment.sh
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          printf 'trusted_ref=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Release environment gate
  # -----------------------------------------------------------------------
  approve:
    name: "Release Environment Gate"
    runs-on: ubuntu-24.04
    needs: [ci, validate-release-inputs]
    permissions: {}
    environment: release
    steps:
      - name: Environment gate passed
        env:
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: printf 'Release %s at commit %s passed the configured release environment gate with trusted source %s.\n' "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" "$TRUSTED_RELEASE_REF"

  # Independent second approval. GitHub required-reviewers on one environment
  # are one-of; a second environment with a distinct reviewer is two-of.
  approve-second:
    name: "Release Second Approver Gate"
    runs-on: ubuntu-24.04
    needs: [ci, validate-release-inputs]
    permissions: {}
    environment: release-second
    steps:
      - name: Second environment gate passed
        env:
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: printf 'Release %s at commit %s passed the second release environment gate with trusted source %s.\n' "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" "$TRUSTED_RELEASE_REF"

  # -----------------------------------------------------------------------
  # Signed tag gate for real releases
  # -----------------------------------------------------------------------
  verify-signed-tag:
    name: "Verify Signed Release Tag"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      tag_object_sha: ${{ steps.verify-tag.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.verify-tag.outputs.tag_commit_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh

      - name: Require signed tag for non-dry-run release
        id: verify-tag
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          EXOCHAIN_RELEASE_SIGNING_PUBLIC_KEY_ASC: ${{ vars.EXOCHAIN_RELEASE_SIGNING_PUBLIC_KEY_ASC }}
          EXOCHAIN_RELEASE_SIGNING_FINGERPRINT: ${{ vars.EXOCHAIN_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            printf 'tag_object_sha=\n' >> "$GITHUB_OUTPUT"
            printf 'tag_commit_sha=\n' >> "$GITHUB_OUTPUT"
            echo "Dry run: signed tag requirement is skipped."
            exit 0
          fi

          signing_key_fingerprint="$(printf '%s' "$EXOCHAIN_RELEASE_SIGNING_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! [[ "$signing_key_fingerprint" =~ ^[0-9A-F]{40}$ ]]; then
            echo "EXOCHAIN_RELEASE_SIGNING_FINGERPRINT must be a 40-character OpenPGP fingerprint." >&2
            exit 1
          fi
          if [ -z "$EXOCHAIN_RELEASE_SIGNING_PUBLIC_KEY_ASC" ]; then
            echo "EXOCHAIN_RELEASE_SIGNING_PUBLIC_KEY_ASC repository variable is required." >&2
            exit 1
          fi

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$EXOCHAIN_RELEASE_SIGNING_PUBLIC_KEY_ASC" | gpg --batch --import

          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [ "$tag_type" != "tag" ]; then
            echo "Release tag ${RELEASE_TAG} must be an annotated signed tag, got ${tag_type}." >&2
            exit 1
          fi
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_tag_signer.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
          tag_object_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          peeled_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$peeled_commit" != "$EXPECTED_COMMIT_SHA" ] || [ "$peeled_commit" != "$GITHUB_SHA" ]; then
            echo "Signed release tag ${RELEASE_TAG} resolves to ${peeled_commit}, expected ${EXPECTED_COMMIT_SHA} at dispatch ${GITHUB_SHA}." >&2
            exit 1
          fi
          printf 'tag_object_sha=%s\n' "$tag_object_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_commit_sha=%s\n' "$peeled_commit" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Build release artifacts
  # -----------------------------------------------------------------------
  release-build:
    name: "Build Legacy Native ABI Artifacts"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      x86_64_sha256: ${{ steps.transport-native.outputs.x86_64_sha256 }}
      aarch64_sha256: ${{ steps.transport-native.outputs.aarch64_sha256 }}
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote release tag identity
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
        run: |
          /usr/bin/sudo /usr/bin/apt-get update
          /usr/bin/sudo /usr/bin/apt-get install -y gcc-aarch64-linux-gnu

      - name: Resolve trusted release tool path
        id: trusted-tools
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          trusted_identity="$(
            /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/resolve_release_tool_path.sh" | \
              /usr/bin/env -i \
                RUNNER_TEMP="$RUNNER_TEMP" \
                RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
                RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
                RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
                /bin/bash --noprofile --norc -p -s -- --identity cargo bash tar
          )"
          printf 'identity=%s\n' "$trusted_identity" >> "$GITHUB_OUTPUT"

      - name: Reverify source and tag immediately before release build
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p

      - name: Build and transport exact legacy libexo_* native ABI scope
        id: transport-native
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          TRUSTED_RELEASE_TOOL_IDENTITY: ${{ steps.trusted-tools.outputs.identity }}
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_CARGO_HOME: ${{ runner.temp }}/exochain-release-build-cargo-home
          RELEASE_TOOL_HOME: ${{ runner.temp }}/exochain-release-build-home
          RELEASE_TARGET_DIR: ${{ runner.temp }}/exochain-release-target-${{ matrix.target }}
          RELEASE_RAW_DIR: ${{ runner.temp }}/exochain-release-raw-${{ matrix.target }}
          RELEASE_TRANSPORT_ARCHIVE: ${{ runner.temp }}/exochain-release-output-${{ matrix.target }}.tar
          RELEASE_TRANSPORT_INVENTORY: ${{ runner.temp }}/exochain-release-output-${{ matrix.target }}.inventory
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          for clean_directory in "$RELEASE_CARGO_HOME" "$RELEASE_TOOL_HOME" "$RELEASE_TARGET_DIR"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          # The source guard immediately above has verified both worktree bytes
          # and the complete Git object graph. Capture every later helper into
          # this shell before Cargo can execute repository build logic.
          # shellcheck source=tools/capture_release_helper.sh
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/ci_cargo_retry.sh retry_program
          capture_release_helper tools/verify_release_cargo_config.sh cargo_config_program
          capture_release_helper tools/transport_release_build_output.py transport_program
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          fresh_path="$(/usr/bin/env -i \
              RUNNER_TEMP="$RUNNER_TEMP" \
              RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
              RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
              RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              /bin/bash --noprofile --norc -p -s -- cargo bash tar <<<"$resolver_program")"
          fresh_view="${fresh_path%%:*}"
          [ "$(/bin/cat "$fresh_view/.release-tool-identity")" = "$TRUSTED_RELEASE_TOOL_IDENTITY" ]
          cargo_path="$(/usr/bin/realpath "$fresh_view/cargo")"
          rustc_path="$(/usr/bin/realpath "$fresh_view/rustc")"
          rustdoc_path="$(/usr/bin/realpath "$fresh_view/rustdoc")"
          printf '%s' "$cargo_config_program" | \
            /usr/bin/env -i GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              /bin/bash --noprofile --norc -p
          /usr/bin/env -i \
            PATH="$fresh_path" \
            HOME="$RELEASE_TOOL_HOME" \
            CARGO_HOME="$RELEASE_CARGO_HOME" \
            RUSTUP_HOME=/home/runner/.rustup \
            RUSTUP_TOOLCHAIN=1.97.1 \
            CARGO_TARGET_DIR="$RELEASE_TARGET_DIR" \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER" \
            RUSTC="$rustc_path" \
            RUSTDOC="$rustdoc_path" \
            CARGO_TERM_COLOR=always \
            CARGO_NET_RETRY=10 \
            CARGO_HTTP_TIMEOUT=120 \
            CARGO_HTTP_MULTIPLEXING=false \
            RUSTFLAGS='-D warnings' \
            TZ=UTC \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            /bin/bash --noprofile --norc -p -s -- "$cargo_path" build --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --workspace --release --locked --target ${{ matrix.target }} <<<"$retry_program"
          case "$RELEASE_RAW_DIR" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
          /bin/rm -rf -- "$RELEASE_RAW_DIR"
          /bin/mkdir -m 700 -p "$RELEASE_RAW_DIR"
          /bin/rm -f -- "$RELEASE_TRANSPORT_ARCHIVE" "$RELEASE_TRANSPORT_INVENTORY"
          # Preserve the established 0.2.x native artifact contract: exactly
          # the 29 libexo_* rlibs, not a claim to archive every publishable
          # workspace crate. WASM is transported by its dedicated lane.
          /usr/bin/find "$RELEASE_TARGET_DIR/${{ matrix.target }}/release" -maxdepth 1 -type f \
            -name 'libexo_*.rlib' -exec /bin/cp -- {} "$RELEASE_RAW_DIR/" \;
          transport_sha="$(printf '%s' "$transport_program" | \
            /usr/bin/env -i "$python_path" -I -B - create \
              --input-dir "$RELEASE_RAW_DIR" \
              --archive "$RELEASE_TRANSPORT_ARCHIVE" \
              --inventory "$RELEASE_TRANSPORT_INVENTORY")"
          [[ "$transport_sha" =~ ^[0-9a-f]{64}$ ]]
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              printf 'x86_64_sha256=%s\n' "$transport_sha" >> "$GITHUB_OUTPUT"
              ;;
            aarch64-unknown-linux-gnu)
              printf 'aarch64_sha256=%s\n' "$transport_sha" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac

      - name: Upload strict release-output transport
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-release-output-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/exochain-release-output-${{ matrix.target }}.tar
            ${{ runner.temp }}/exochain-release-output-${{ matrix.target }}.inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-release:
    name: "Package Legacy Native ABI Artifacts"
    runs-on: ubuntu-24.04
    needs: [release-build, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
