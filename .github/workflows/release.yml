      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Reverify source and tag immediately before SBOM lifecycle
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p

      - name: Generate strict raw CycloneDX transport with isolated tool bytes
        id: generate-raw-sbom
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_CARGO_TOOL_HOME: ${{ runner.temp }}/exochain-sbom-tools
          RELEASE_CARGO_HOME: ${{ runner.temp }}/exochain-sbom-cargo-home
          RELEASE_TOOL_HOME: ${{ runner.temp }}/exochain-sbom-home
          RELEASE_TARGET_DIR: ${{ runner.temp }}/exochain-sbom-target
          RELEASE_SBOM_DIR: ${{ runner.temp }}/exochain-raw-sbom-output
          RELEASE_TOOL_INPUT: ${{ runner.temp }}/cargo-cyclonedx-tool-input
          RELEASE_SBOM_ARCHIVE: ${{ runner.temp }}/exochain-raw-sbom.tar
          RELEASE_SBOM_INVENTORY: ${{ runner.temp }}/exochain-raw-sbom.inventory
          RELEASE_EXPECTED_TOOL_SHA256: ${{ needs.install-cargo-cyclonedx.outputs.archive_sha256 }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
        run: |
          set -euo pipefail
          for clean_directory in \
            "$RELEASE_CARGO_TOOL_HOME" \
            "$RELEASE_CARGO_HOME" \
            "$RELEASE_TOOL_HOME" \
            "$RELEASE_TARGET_DIR" \
            "$RELEASE_SBOM_DIR"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          /bin/rm -f -- "$RELEASE_SBOM_ARCHIVE" "$RELEASE_SBOM_INVENTORY"

          # Capture trusted validators before the SBOM lifecycle begins. The
          # downloaded tool and generated SBOM remain untrusted transport until
          # fresh downstream validation.
          # shellcheck source=tools/capture_release_helper.sh
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/verify_release_cargo_config.sh cargo_config_program
          capture_release_helper tools/transport_release_file_set.py transport_program

          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          printf '%s' "$transport_program" | /usr/bin/env -i "$python_path" -I -B - extract \
            --profile cargo-cyclonedx --version 0.5.9 \
            --archive "$RELEASE_TOOL_INPUT/cargo-cyclonedx-0.5.9.tar" \
            --inventory "$RELEASE_TOOL_INPUT/cargo-cyclonedx-0.5.9.inventory" \
            --expected-sha256 "$RELEASE_EXPECTED_TOOL_SHA256" \
            --output-dir "$RELEASE_CARGO_TOOL_HOME/bin"

          base_identity="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            /bin/bash --noprofile --norc -p -s -- --identity cargo bash tar <<<"$resolver_program")"
          base_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            /bin/bash --noprofile --norc -p -s -- cargo bash tar <<<"$resolver_program")"
          [ "$(/bin/cat "${base_path%%:*}/.release-tool-identity")" = "$base_identity" ]
          base_view="${base_path%%:*}"
          cargo_path="$(/usr/bin/realpath "$base_view/cargo")"
          rustc_path="$(/usr/bin/realpath "$base_view/rustc")"
          rustdoc_path="$(/usr/bin/realpath "$base_view/rustdoc")"
          printf '%s' "$cargo_config_program" | \
            /usr/bin/env -i GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              /bin/bash --noprofile --norc -p

          sbom_identity="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            RELEASE_TRUSTED_CARGO_TOOL_HOME="$RELEASE_CARGO_TOOL_HOME" \
            /bin/bash --noprofile --norc -p -s -- --identity \
              cargo cargo-cyclonedx bash tar <<<"$resolver_program")"
          sbom_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            RELEASE_TRUSTED_CARGO_TOOL_HOME="$RELEASE_CARGO_TOOL_HOME" \
            /bin/bash --noprofile --norc -p -s -- \
              cargo cargo-cyclonedx bash tar <<<"$resolver_program")"
          [ "$(/bin/cat "${sbom_path%%:*}/.release-tool-identity")" = "$sbom_identity" ]
          sbom_view="${sbom_path%%:*}"
          cargo_path="$(/usr/bin/realpath "$sbom_view/cargo")"
          rustc_path="$(/usr/bin/realpath "$sbom_view/rustc")"
          rustdoc_path="$(/usr/bin/realpath "$sbom_view/rustdoc")"

          [ "$(/usr/bin/env -i \
              PATH="$sbom_path" HOME="$RELEASE_TOOL_HOME" CARGO_HOME="$RELEASE_CARGO_HOME" \
              RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
              RUSTUP_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              "$cargo_path" cyclonedx --version)" = "cargo-cyclonedx-cyclonedx 0.5.9" ]

          release_cargo() {
            /usr/bin/env -i \
              PATH="$sbom_path" \
              HOME="$RELEASE_TOOL_HOME" \
              CARGO_HOME="$RELEASE_CARGO_HOME" \
              RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
              RUSTUP_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              CARGO="$cargo_path" \
              CARGO_TARGET_DIR="$RELEASE_TARGET_DIR" \
              CARGO_TERM_COLOR=always \
              CARGO_NET_RETRY=10 \
              CARGO_HTTP_TIMEOUT=120 \
              CARGO_HTTP_MULTIPLEXING=false \
              RUSTFLAGS='-D warnings' \
              RUSTC="$rustc_path" \
              RUSTDOC="$rustdoc_path" \
              RUSTC_WRAPPER= \
              RUSTC_WORKSPACE_WRAPPER= \
              SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-}" \
              TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$@"
          }
          release_cargo "$cargo_path" metadata \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --format-version 1 --locked >/dev/null
          SOURCE_DATE_EPOCH=0 release_cargo "$cargo_path" cyclonedx \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -f json --all --target all --spec-version 1.5

          sbom_count=0
          while IFS= read -r -d '' sbom_file; do
            sbom_name="$(/usr/bin/basename "$sbom_file")"
            [[ "$sbom_name" =~ ^exochain-[a-z0-9-]+\.cdx\.json$ ]]
            [ ! -e "$RELEASE_SBOM_DIR/$sbom_name" ] && [ ! -L "$RELEASE_SBOM_DIR/$sbom_name" ]
            /bin/cp -- "$sbom_file" "$RELEASE_SBOM_DIR/$sbom_name"
            /bin/rm -f -- "$sbom_file"
            sbom_count=$((sbom_count + 1))
          done < <(/usr/bin/find "$GITHUB_WORKSPACE/crates" -type f -name '*.cdx.json' -print0 | /usr/bin/sort -z)
          [ "$sbom_count" -eq 32 ]
          raw_sbom_sha256="$(printf '%s' "$transport_program" | \
            /usr/bin/env -i "$python_path" -I -B - create \
              --profile raw-sbom --version "$RELEASE_VERSION" \
              --input-dir "$RELEASE_SBOM_DIR" \
              --archive "$RELEASE_SBOM_ARCHIVE" \
              --inventory "$RELEASE_SBOM_INVENTORY")"
          [[ "$raw_sbom_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'raw_sbom_sha256=%s\n' "$raw_sbom_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload strict raw SBOM transport
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-sbom-${{ needs.validate-release-inputs.outputs.version }}
          path: |
            ${{ runner.temp }}/exochain-raw-sbom.tar
            ${{ runner.temp }}/exochain-raw-sbom.inventory
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  validate-sbom:
    name: "Validate and canonicalize Release SBOM"
    runs-on: ubuntu-24.04
    needs: [generate-sbom, verify-signed-tag, validate-release-inputs]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    outputs:
      canonical_sbom_sha256: ${{ steps.validate-sbom.outputs.canonical_sbom_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download strict raw SBOM transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          name: raw-sbom-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-raw-sbom-input
      - name: Verify checked-out release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote release tag identity
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Reverify source and tag immediately before SBOM validation
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
      - name: Strictly validate and canonicalize raw SBOMs
        id: validate-sbom
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          RELEASE_TRUSTED_CARGO_HOME: /home/runner/.cargo
          RELEASE_TRUSTED_RUSTUP_HOME: /home/runner/.rustup
          RELEASE_TRUSTED_RUST_TOOLCHAIN: 1.97.1
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_VALIDATION_ROOT: ${{ runner.temp }}/exochain-sbom-validation
          RELEASE_RAW_INPUT: ${{ runner.temp }}/exochain-raw-sbom-input
          RELEASE_RAW_DIR: ${{ runner.temp }}/exochain-sbom-validation/raw
          RELEASE_FINAL_DIR: ${{ runner.temp }}/exochain-sbom-validation/final
          RELEASE_METADATA: ${{ runner.temp }}/exochain-sbom-validation/cargo-metadata.json
          RELEASE_CARGO_HOME: ${{ runner.temp }}/exochain-sbom-validation/cargo-home
          RELEASE_CARGO_TARGET: ${{ runner.temp }}/exochain-sbom-validation/cargo-target
          RELEASE_HOME: ${{ runner.temp }}/exochain-sbom-validation/home
          RELEASE_EXPECTED_RAW_SHA256: ${{ needs.generate-sbom.outputs.raw_sbom_sha256 }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VALIDATION_ROOT" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
          /bin/rm -rf -- "$RELEASE_VALIDATION_ROOT"
          /bin/mkdir -m 700 -p "$RELEASE_VALIDATION_ROOT" "$RELEASE_CARGO_HOME" "$RELEASE_CARGO_TARGET" "$RELEASE_HOME"
          # shellcheck source=tools/capture_release_helper.sh
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/verify_release_cargo_config.sh cargo_config_program
          capture_release_helper tools/transport_release_file_set.py transport_program
          capture_release_helper tools/verify_release_sbom.py sbom_validator_program

          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          printf '%s' "$cargo_config_program" | /usr/bin/env -i \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" /bin/bash --noprofile --norc -p
          printf '%s' "$transport_program" | /usr/bin/env -i "$python_path" -I -B - extract \
            --profile raw-sbom --version "$RELEASE_VERSION" \
            --archive "$RELEASE_RAW_INPUT/exochain-raw-sbom.tar" \
            --inventory "$RELEASE_RAW_INPUT/exochain-raw-sbom.inventory" \
            --expected-sha256 "$RELEASE_EXPECTED_RAW_SHA256" \
            --output-dir "$RELEASE_RAW_DIR"

          cargo_path_value="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_CARGO_HOME="$RELEASE_TRUSTED_CARGO_HOME" \
            RELEASE_TRUSTED_RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            /bin/bash --noprofile --norc -p -s -- cargo bash tar <<<"$resolver_program")"
          cargo_view="${cargo_path_value%%:*}"
          cargo_path="$(/usr/bin/realpath "$cargo_view/cargo")"
          rustc_path="$(/usr/bin/realpath "$cargo_view/rustc")"
          rustdoc_path="$(/usr/bin/realpath "$cargo_view/rustdoc")"
          (
            cd /
            /usr/bin/env -i \
              PATH="$cargo_path_value" HOME="$RELEASE_HOME" CARGO_HOME="$RELEASE_CARGO_HOME" \
              CARGO_TARGET_DIR="$RELEASE_CARGO_TARGET" \
              RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" RUSTUP_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              RUSTC="$rustc_path" RUSTDOC="$rustdoc_path" RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= \
              CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false \
              TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$cargo_path" metadata --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
                --format-version 1 --locked > "$RELEASE_METADATA"
          )
          canonical_sbom_sha256="$(printf '%s' "$sbom_validator_program" | \
            /usr/bin/env -i "$python_path" -I -B - \
              --input-dir "$RELEASE_RAW_DIR" \
              --cargo-metadata "$RELEASE_METADATA" \
              --cargo-lock "$GITHUB_WORKSPACE/Cargo.lock" \
              --output-dir "$RELEASE_FINAL_DIR" \
              --version "$RELEASE_VERSION" \
              --forbid-prefix "$GITHUB_WORKSPACE" \
              --forbid-prefix "$RUNNER_TEMP")"
          [[ "$canonical_sbom_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'canonical_sbom_sha256=%s\n' "$canonical_sbom_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload canonical validated SBOM artifacts
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-sbom-validation/final/exochain-${{ needs.validate-release-inputs.outputs.version }}-*.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  # -----------------------------------------------------------------------
  # Attest already-built archives in a fresh OIDC-only job. No compiler,
  # package manager, generated code, or release build runs with attestation
  # authority in its environment.
  # -----------------------------------------------------------------------
  attest-release:
    name: "Attest Release Archives"
    runs-on: ubuntu-24.04
    needs: [package-release, validate-sbom, verify-signed-tag, validate-release-inputs]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
