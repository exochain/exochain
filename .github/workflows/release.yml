      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Download untrusted tested LYNK dist transport
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exochain-llm-dist-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-llm-dist-input
      - name: Reverify source and tag immediately before immutable LYNK packaging
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
      - name: Reconstruct and pack exact LYNK npm package
        id: pack-llm
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_NPM_HOME: ${{ runner.temp }}/exochain-llm-pack-home
          RELEASE_NPM_USER_CONFIG: ${{ runner.temp }}/exochain-llm-pack-home/user.npmrc
          RELEASE_NPM_GLOBAL_CONFIG: ${{ runner.temp }}/exochain-llm-pack-home/global.npmrc
          RELEASE_NPM_PACK_DIR: ${{ runner.temp }}/exochain-llm-pack
          RELEASE_NPM_EXTRACT_DIR: ${{ runner.temp }}/exochain-llm-extract
          RELEASE_PACKAGE_MANIFEST: ${{ runner.temp }}/exochain-llm-package.manifest
          RELEASE_LLM_STAGE_ROOT: ${{ runner.temp }}/exochain-llm-package-stage
          RELEASE_LLM_STAGE_DIR: ${{ runner.temp }}/exochain-llm-package-stage/packages/exochain-llm-proxy
          RELEASE_LLM_BUILD_DIR: ${{ runner.temp }}/exochain-llm-tested-build
          RELEASE_LLM_TRANSPORT_INPUT: ${{ runner.temp }}/exochain-llm-dist-input
          RELEASE_EXPECTED_LLM_TRANSPORT_SHA256: ${{ needs.test-llm-proxy-npm.outputs.transport_sha256 }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
        run: |
          set -euo pipefail
          for clean_directory in "$RELEASE_NPM_HOME" "$RELEASE_NPM_PACK_DIR" "$RELEASE_NPM_EXTRACT_DIR"; do
            case "$clean_directory" in "$RELEASE_TEMP_ROOT/"*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$clean_directory"
            /bin/mkdir -m 700 -p "$clean_directory"
          done
          /bin/rm -rf -- "$RELEASE_LLM_STAGE_ROOT"
          /bin/rm -rf -- "$RELEASE_LLM_BUILD_DIR"
          /bin/mkdir -m 700 -p "$RELEASE_LLM_BUILD_DIR"
          /bin/rm -f -- "$RELEASE_PACKAGE_MANIFEST"
          : > "$RELEASE_NPM_USER_CONFIG"
          : > "$RELEASE_NPM_GLOBAL_CONFIG"
          /bin/chmod 600 "$RELEASE_NPM_USER_CONFIG" "$RELEASE_NPM_GLOBAL_CONFIG"
          [ "$RELEASE_NPM_USER_CONFIG" != "$RELEASE_NPM_GLOBAL_CONFIG" ]
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$(/usr/bin/env -i "$python_path" -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          resolver="$RUNNER_TEMP/exochain-llm-pack-resolver.sh"
          verify_script="$RUNNER_TEMP/exochain-verify-llm-pack.mjs"
          tarball_guard="$RUNNER_TEMP/exochain-verify-llm-tarball.py"
          stage_helper="$RUNNER_TEMP/exochain-stage-llm-package.sh"
          transport_helper="$RUNNER_TEMP/exochain-transport-llm-dist.py"
          /bin/rm -f -- "$resolver" "$verify_script" "$tarball_guard" "$stage_helper" "$transport_helper"
          for helper_spec in \
            "tools/resolve_release_tool_path.sh:$resolver" \
            "tools/verify_npm_release_package.mjs:$verify_script" \
            "tools/verify_npm_release_tarball.py:$tarball_guard" \
            "tools/stage_llm_release_package.sh:$stage_helper" \
            "tools/transport_release_file_set.py:$transport_helper"; do
            helper_source="${helper_spec%%:*}"
            helper_target="${helper_spec#*:}"
            /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show \
                "${GITHUB_SHA}:$helper_source" > "$helper_target"
          done
          /bin/chmod 500 "$stage_helper"
          [[ "$RELEASE_EXPECTED_LLM_TRANSPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          expected_transport_files="$(/usr/bin/printf '%s\n' \
            "$RELEASE_LLM_TRANSPORT_INPUT/exochain-llm-dist.tar" \
            "$RELEASE_LLM_TRANSPORT_INPUT/exochain-llm-dist.inventory" | /usr/bin/sort)"
          actual_transport_files="$(/usr/bin/find "$RELEASE_LLM_TRANSPORT_INPUT" -mindepth 1 -maxdepth 1 -type f ! -type l -print | /usr/bin/sort)"
          [ "$actual_transport_files" = "$expected_transport_files" ]
          [ "$(/usr/bin/find "$RELEASE_LLM_TRANSPORT_INPUT" -mindepth 1 -maxdepth 1 -print | /usr/bin/wc -l | /usr/bin/tr -d ' ')" -eq 2 ]
          /usr/bin/env -i "$python_path" -I -B "$transport_helper" extract \
            --profile llm-dist --version "$RELEASE_VERSION" \
            --archive "$RELEASE_LLM_TRANSPORT_INPUT/exochain-llm-dist.tar" \
            --inventory "$RELEASE_LLM_TRANSPORT_INPUT/exochain-llm-dist.inventory" \
            --expected-sha256 "$RELEASE_EXPECTED_LLM_TRANSPORT_SHA256" \
            --output-dir "$RELEASE_LLM_BUILD_DIR/dist"
          /usr/bin/env -i \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_SHA="$GITHUB_SHA" \
            RUNNER_TEMP="$RUNNER_TEMP" RELEASE_LLM_BUILD_DIR="$RELEASE_LLM_BUILD_DIR" \
            RELEASE_PYTHON="$python_path" \
            RELEASE_LLM_STAGE_ROOT="$RELEASE_LLM_STAGE_ROOT" \
            /bin/bash --noprofile --norc -p "$stage_helper" >/dev/null
          [ -d "$RELEASE_LLM_STAGE_DIR" ] && [ ! -L "$RELEASE_LLM_STAGE_DIR" ]
          trusted_identity="$(/usr/bin/env -i \
              RUNNER_TEMP="$RUNNER_TEMP" RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
              RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
              /bin/bash --noprofile --norc -p "$resolver" --identity node npm bash tar)"
          fresh_path="$(/usr/bin/env -i \
              RUNNER_TEMP="$RUNNER_TEMP" RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
              RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
              /bin/bash --noprofile --norc -p "$resolver" node npm bash tar)"
          fresh_view="${fresh_path%%:*}"
          [ "$(/bin/cat "$fresh_view/.release-tool-identity")" = "$trusted_identity" ]
          node_path="$(/usr/bin/realpath "$fresh_view/node")"
          npm_path="$(/usr/bin/realpath "$fresh_view/npm")"
          [ "$(/usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
              NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
              NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
              "$npm_path" --version)" = 10.9.2 ]
          /usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
            RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_PACKAGE_MANIFEST_OUTPUT="$RELEASE_PACKAGE_MANIFEST" \
            "$node_path" "$verify_script" llm-source "$RELEASE_LLM_STAGE_DIR"
          cd /
          pack_json="$(/usr/bin/env -i \
              PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
              NPM_CONFIG_CACHE="$RELEASE_NPM_HOME/cache" \
              NPM_CONFIG_USERCONFIG="$RELEASE_NPM_USER_CONFIG" \
              NPM_CONFIG_GLOBALCONFIG="$RELEASE_NPM_GLOBAL_CONFIG" \
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org NPM_CONFIG_IGNORE_SCRIPTS=true \
              "$npm_path" pack "$RELEASE_LLM_STAGE_DIR" --json \
                --pack-destination "$RELEASE_NPM_PACK_DIR" --ignore-scripts \
                --registry=https://registry.npmjs.org)"
          tarball_name="$(printf '%s' "$pack_json" | /usr/bin/env -i "$node_path" \
            -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(0,"utf8"));if(!Array.isArray(p)||p.length!==1||typeof p[0].filename!=="string")process.exit(1);process.stdout.write(p[0].filename)')"
          [ "$tarball_name" = "exochain-llm-proxy-$RELEASE_VERSION.tgz" ] \
            || { echo "Unexpected LYNK tarball name: $tarball_name" >&2; exit 1; }
          release_tarball="$RELEASE_NPM_PACK_DIR/$tarball_name"
          [ -f "$release_tarball" ] && [ ! -L "$release_tarball" ]
          /bin/rm -rf -- "$RELEASE_NPM_EXTRACT_DIR"
          /usr/bin/env -i "$python_path" -I -B "$tarball_guard" \
            "$release_tarball" "$RELEASE_NPM_EXTRACT_DIR"
          /usr/bin/env -i PATH="$fresh_path" HOME="$RELEASE_NPM_HOME" \
            RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_EXPECTED_PACKAGE_MANIFEST="$RELEASE_PACKAGE_MANIFEST" \
            "$node_path" "$verify_script" llm "$RELEASE_NPM_EXTRACT_DIR/package"
          tarball_sha256="$(/usr/bin/sha256sum "$release_tarball" | /usr/bin/cut -d ' ' -f 1)"
          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload exact LYNK npm package
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llm-proxy-npm-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-llm-pack/${{ steps.pack-llm.outputs.tarball_name }}
          if-no-files-found: error
          retention-days: 30

  # Build, test, lint, and pack the public TypeScript SDK without registry
  # credentials. The source is reconstructed from the dispatch commit before
  # any package lifecycle code runs, and the packed bytes are bound to a
  # strict reviewed file manifest.
  prepare-sdk-npm:
    name: "Prepare exact TypeScript SDK npm package"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      tarball_name: ${{ steps.pack-sdk.outputs.tarball_name }}
      tarball_sha256: ${{ steps.pack-sdk.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact SDK release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote SDK release tag
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Rebind source and tag immediately before SDK lifecycle
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | \
            BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
      - name: npm ci, npm test, npm run build, and npm pack exact SDK
        id: pack-sdk
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
        run: |
          set -euo pipefail
          source_root="$RELEASE_TEMP_ROOT/exochain-sdk-source"
          package_dir="$source_root/packages/exochain-sdk"
          pack_dir="$RELEASE_TEMP_ROOT/exochain-sdk-pack"
          extract_dir="$RELEASE_TEMP_ROOT/exochain-sdk-extract"
          npm_home="$RELEASE_TEMP_ROOT/exochain-sdk-npm-home"
          package_manifest="$RELEASE_TEMP_ROOT/exochain-sdk-package.manifest"
          for directory in "$source_root" "$pack_dir" "$extract_dir" "$npm_home"; do
            case "$directory" in "$RELEASE_TEMP_ROOT"/*) ;; *) exit 1 ;; esac
            /bin/rm -rf -- "$directory"
            /bin/mkdir -m 700 -p "$directory"
          done
          /bin/rm -f -- "$package_manifest"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" archive \
              --format=tar "$GITHUB_SHA" \
              packages/exochain-sdk tests/fixtures/did-derivation.json | \
            /usr/bin/env -i TAR_OPTIONS= /usr/bin/tar -xf - -C "$source_root"
          [ -d "$package_dir" ] && [ ! -L "$package_dir" ]

          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/resolve_release_tool_path.sh resolver_program
          capture_release_helper tools/verify_npm_release_package.mjs verify_program
          capture_release_helper tools/verify_npm_release_tarball.py tarball_program
          tool_identity="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p -s -- --identity node npm bash tar <<<"$resolver_program")"
          trusted_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p -s -- node npm bash tar <<<"$resolver_program")"
          [ "$(/bin/cat "${trusted_path%%:*}/.release-tool-identity")" = "$tool_identity" ]
          node_path="$(/usr/bin/realpath "${trusted_path%%:*}/node")"
          npm_path="$(/usr/bin/realpath "${trusted_path%%:*}/npm")"
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$($python_path -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          [ "$($node_path --version)" = v22.14.0 ]
          [ "$($npm_path --version)" = 10.9.2 ]
          : > "$npm_home/user.npmrc"
          : > "$npm_home/global.npmrc"
          /bin/chmod 600 "$npm_home/user.npmrc" "$npm_home/global.npmrc"
          printf '%s' "$verify_program" | /usr/bin/env -i \
            PATH="$trusted_path" HOME="$npm_home" RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            "$node_path" --input-type=module - sdk-source "$package_dir"

          /bin/rm -rf -- "$package_dir/dist" "$package_dir/dist-test"
          cd "$package_dir"
          for command in ci test lint; do
            if [ "$command" = ci ]; then
              /usr/bin/env -i PATH="$trusted_path" HOME="$npm_home" \
                NPM_CONFIG_CACHE="$npm_home/cache" \
                NPM_CONFIG_USERCONFIG="$npm_home/user.npmrc" \
                NPM_CONFIG_GLOBALCONFIG="$npm_home/global.npmrc" \
                NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
                NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
                TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                "$npm_path" ci --ignore-scripts --registry=https://registry.npmjs.org
            else
              /usr/bin/env -i PATH="$trusted_path" HOME="$npm_home" \
                NPM_CONFIG_CACHE="$npm_home/cache" \
                NPM_CONFIG_USERCONFIG="$npm_home/user.npmrc" \
                NPM_CONFIG_GLOBALCONFIG="$npm_home/global.npmrc" \
                NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
                NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
                TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                "$npm_path" run "$command"
            fi
          done
          /bin/rm -rf -- "$package_dir/dist" "$package_dir/dist-test"
          /usr/bin/env -i PATH="$trusted_path" HOME="$npm_home" \
            NPM_CONFIG_CACHE="$npm_home/cache" \
            NPM_CONFIG_USERCONFIG="$npm_home/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$npm_home/global.npmrc" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org \
            NPM_CONFIG_IGNORE_SCRIPTS=true NPM_CONFIG_SCRIPT_SHELL=/bin/bash \
            TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$npm_path" run build
          printf '%s' "$verify_program" | /usr/bin/env -i \
            PATH="$trusted_path" HOME="$npm_home" RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_PACKAGE_MANIFEST_OUTPUT="$package_manifest" \
            "$node_path" --input-type=module - sdk-source "$package_dir"
          cd /
          pack_json="$(/usr/bin/env -i PATH="$trusted_path" HOME="$npm_home" \
            NPM_CONFIG_CACHE="$npm_home/cache" \
            NPM_CONFIG_USERCONFIG="$npm_home/user.npmrc" \
            NPM_CONFIG_GLOBALCONFIG="$npm_home/global.npmrc" \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org NPM_CONFIG_IGNORE_SCRIPTS=true \
            "$npm_path" pack "$package_dir" --json --pack-destination "$pack_dir" \
              --ignore-scripts --registry=https://registry.npmjs.org)"
          tarball_name="$(printf '%s' "$pack_json" | "$node_path" \
            -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(0,"utf8"));if(!Array.isArray(p)||p.length!==1||typeof p[0].filename!=="string")process.exit(1);process.stdout.write(p[0].filename)')"
          [ "$tarball_name" = "exochain-sdk-$RELEASE_VERSION.tgz" ]
          release_tarball="$pack_dir/$tarball_name"
          /usr/bin/env -i "$python_path" -I -B -c "$tarball_program" \
            "$release_tarball" "$extract_dir"
          printf '%s' "$verify_program" | /usr/bin/env -i \
            PATH="$trusted_path" HOME="$npm_home" RELEASE_EXPECTED_VERSION="$RELEASE_VERSION" \
            RELEASE_EXPECTED_PACKAGE_MANIFEST="$package_manifest" \
            "$node_path" --input-type=module - sdk "$extract_dir/package"
          tarball_sha256="$(/usr/bin/sha256sum "$release_tarball" | /usr/bin/cut -d ' ' -f 1)"
          printf 'tarball_name=%s\n' "$tarball_name" >> "$GITHUB_OUTPUT"
          printf 'tarball_sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload exact token-free TypeScript SDK tarball
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-sdk-npm-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-sdk-pack/${{ steps.pack-sdk.outputs.tarball_name }}
          if-no-files-found: error
          retention-days: 30

  # Build and validate both Python distribution formats before any PyPI OIDC
  # authority exists. The manifest is the exact digest contract consumed by
  # the later fresh publisher runner.
  prepare-python-package:
    name: "Prepare exact Python SDK distributions"
    runs-on: ubuntu-24.04
    needs: [approve, approve-second, verify-signed-tag, validate-release-inputs]
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.package-python.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Python release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote Python release tag
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Rebind source and tag immediately before Python lifecycle
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_SOURCE_CLEAN_MODE: all
          RELEASE_ALLOWED_UNTRACKED_PATHS: ""
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/verify_release_side_effect.sh" | \
            BASH_ENV=/dev/null /bin/bash --noprofile --norc -p
      - name: Run pytest, ruff, mypy, and python -m build from exact source
        id: package-python
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test_source_root="$RELEASE_TEMP_ROOT/exochain-python-test-source"
          build_source_root="$RELEASE_TEMP_ROOT/exochain-python-build-source"
          test_package_dir="$test_source_root/packages/exochain-py"
          build_package_dir="$build_source_root/packages/exochain-py"
          artifact_root="$RELEASE_TEMP_ROOT/exochain-python-release"
          dist_dir="$artifact_root/dist"
          manifest="$artifact_root/artifact-manifest.tsv"
          tool_root="$RELEASE_TEMP_ROOT/exochain-python-tools"
          python_home="$RELEASE_TEMP_ROOT/exochain-python-home"
          sealed_source="$RELEASE_TEMP_ROOT/exochain-python-source.tar"
          locked_requirements="$RELEASE_TEMP_ROOT/exochain-python-release-requirements.lock"
          /bin/rm -rf -- "$test_source_root" "$build_source_root" "$artifact_root" \
            "$tool_root" "$python_home"
          /bin/rm -f -- "$sealed_source" "$locked_requirements"
          /bin/mkdir -m 700 -p "$test_source_root" "$artifact_root" "$python_home"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" archive \
              --format=tar --output="$sealed_source" "$GITHUB_SHA" \
                packages/exochain-py tests/fixtures/did-derivation.json
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/python-release-requirements.lock" > "$locked_requirements"
          /bin/chmod 400 "$sealed_source" "$locked_requirements"
          source_archive_sha256="$(/usr/bin/sha256sum "$sealed_source" | /usr/bin/cut -d ' ' -f 1)"
          requirements_sha256="$(/usr/bin/sha256sum "$locked_requirements" | /usr/bin/cut -d ' ' -f 1)"
          [[ "$source_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$requirements_sha256" =~ ^[0-9a-f]{64}$ ]]
          /usr/bin/env -i TAR_OPTIONS= /usr/bin/tar -xf "$sealed_source" -C "$test_source_root"
          source "$GITHUB_WORKSPACE/tools/capture_release_helper.sh"
          capture_release_helper tools/verify_python_release_package.py verifier_program
          python_path="$(/usr/bin/realpath "$RELEASE_PYTHON")"
          python_root="$(cd "$RELEASE_TRUSTED_PYTHON_ROOT" && pwd -P)"
          case "$python_path" in "$python_root"/*) ;; *) exit 1 ;; esac
          [ -f "$python_path" ] && [ -x "$python_path" ] && [ ! -L "$python_path" ]
          [ "$($python_path -I -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = 3.13.7 ]
          source_date_epoch="$(/usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          /usr/bin/env -i HOME="$python_home" PIP_CONFIG_FILE=/dev/null \
            "$python_path" -I -B -m venv "$tool_root"
          tool_python="$tool_root/bin/python"
          [ -f "$tool_python" ] && [ -x "$tool_python" ]
          /usr/bin/env -i HOME="$python_home" PIP_CONFIG_FILE=/dev/null \
            "$tool_python" -I -B -m pip --isolated install --disable-pip-version-check --no-compile \
              --require-hashes --only-binary=:all: --index-url=https://pypi.org/simple \
              -r "$locked_requirements"
          (
            cd "$test_package_dir"
            /usr/bin/env -i HOME="$python_home" TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$tool_python" -I -B -m pytest tests
            /usr/bin/env -i HOME="$python_home" TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$tool_python" -I -B -m ruff check .
            /usr/bin/env -i HOME="$python_home" TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$tool_python" -I -B -m mypy --config-file pyproject.toml exochain
          )

          # Tests and their locked dependencies never become the publishable
          # source. Recheck the sealed bytes, then reconstruct a fresh build
          # tree from that pre-test archive after all mutable checks finish.
          [ "$(/usr/bin/sha256sum "$sealed_source" | /usr/bin/cut -d ' ' -f 1)" = "$source_archive_sha256" ]
          [ "$(/usr/bin/sha256sum "$locked_requirements" | /usr/bin/cut -d ' ' -f 1)" = "$requirements_sha256" ]
          /bin/mkdir -m 700 -p "$build_source_root"
          /usr/bin/env -i TAR_OPTIONS= /usr/bin/tar -xf "$sealed_source" -C "$build_source_root"
          [ -d "$build_package_dir" ] && [ ! -L "$build_package_dir" ]
          /usr/bin/env -i PATH="$tool_root/bin:/usr/bin:/bin" HOME="$python_home" \
            SOURCE_DATE_EPOCH="$source_date_epoch" TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$tool_python" -I -B -m build --no-isolation --outdir "$dist_dir" "$build_package_dir"
          /usr/bin/env -i "$tool_python" -I -B -c "$verifier_program" \
            artifacts "$dist_dir" exochain "$RELEASE_VERSION" --write-manifest "$manifest"
          manifest_sha256="$(/usr/bin/sha256sum "$manifest" | /usr/bin/cut -d ' ' -f 1)"
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload exact token-free Python distributions
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exochain-python-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-python-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Registry credentials and OIDC are introduced only on fresh runners after
  # both npm tarballs and every crate archive completed token-free preflight.
  publish-wasm-npm:
    name: "Publish Exact WASM npm Package"
    runs-on: ubuntu-24.04
    environment: release
    needs:
      - publish
      - prepare-wasm-npm
      - prepare-llm-proxy-npm
      - verify-signed-tag
      - validate-release-inputs
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          ref: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out release source
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_source.sh
      - name: Verify current remote release tag identity
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          DRY_RUN: false
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        id: setup-python
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          PYTHONPATH: ""
          PYTHONHOME: ""
        with:
          python-version: 3.13.7
          cache: ""
      - name: Download exact token-free WASM tarball
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exochain-wasm-npm-${{ needs.validate-release-inputs.outputs.version }}
          path: ${{ runner.temp }}/exochain-wasm-publish-artifact
      - name: Bind exact WASM publisher tool identity
        id: trusted-tools
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          resolver="$RUNNER_TEMP/exochain-wasm-publisher-resolver.sh"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/resolve_release_tool_path.sh" > "$resolver"
          identity="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p "$resolver" --identity node npm bash tar git curl)"
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]]
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - name: Publish exact WASM npm tarball
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
          DRY_RUN: false
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify-signed-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT_SHA: ${{ needs.verify-signed-tag.outputs.tag_commit_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-release-inputs.outputs.commit_sha }}
          TRUSTED_RELEASE_REF: ${{ needs.validate-release-inputs.outputs.trusted_ref }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}
          RELEASE_NPM_TARBALL: ${{ runner.temp }}/exochain-wasm-publish-artifact/${{ needs.prepare-wasm-npm.outputs.tarball_name }}
          RELEASE_EXPECTED_TARBALL_SHA256: ${{ needs.prepare-wasm-npm.outputs.tarball_sha256 }}
          RELEASE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          RELEASE_TEMP_ROOT: ${{ runner.temp }}
          RELEASE_TRUSTED_PYTHON_ROOT: ${{ runner.tool_cache }}/Python/3.13.7/x64
          RELEASE_TRUSTED_PYTHON_VERSION: 3.13.7
          RELEASE_TRUSTED_NODE_ROOT: ${{ runner.tool_cache }}/node
          RELEASE_TRUSTED_NODE_VERSION: 22.14.0
          RELEASE_TRUSTED_NPM_VERSION: 10.9.2
          TRUSTED_RELEASE_TOOL_IDENTITY: ${{ steps.trusted-tools.outputs.identity }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_SHALLOW_FILE GIT_GRAFT_FILE GIT_EXEC_PATH GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_ATTR_SOURCE
          resolver="$RUNNER_TEMP/exochain-wasm-publisher-final-resolver.sh"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
              show "${GITHUB_SHA}:tools/resolve_release_tool_path.sh" > "$resolver"
          fresh_path="$(/usr/bin/env -i \
            RUNNER_TEMP="$RUNNER_TEMP" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
