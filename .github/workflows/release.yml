            RELEASE_TRUSTED_RUST_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
            RELEASE_TRUSTED_NODE_ROOT="$RELEASE_TRUSTED_NODE_ROOT" \
            RELEASE_TRUSTED_NODE_VERSION="$RELEASE_TRUSTED_NODE_VERSION" \
            /bin/bash --noprofile --norc -p "$resolver" cargo node npm bash tar git curl)"
          [ "$(/bin/cat "${fresh_path%%:*}/.release-tool-identity")" = "$TRUSTED_RELEASE_TOOL_IDENTITY" ]
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/verify_release_cargo_config.sh" | \
            /usr/bin/env -i GITHUB_WORKSPACE="$GITHUB_WORKSPACE" /bin/bash --noprofile --norc -p
          cd "$GITHUB_WORKSPACE"
          /usr/bin/env -i GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" show "${GITHUB_SHA}:tools/check_cratesio_namespace_ownership.mjs" | \
            /usr/bin/env -i \
              PATH="$fresh_path" \
              HOME="$RELEASE_TEMP_ROOT/exochain-namespace-home" \
              CARGO_HOME="$RELEASE_TEMP_ROOT/exochain-namespace-cargo-home" \
              RUSTUP_HOME="$RELEASE_TRUSTED_RUSTUP_HOME" \
              RUSTUP_TOOLCHAIN="$RELEASE_TRUSTED_RUST_TOOLCHAIN" \
              CARGO_TARGET_DIR="$RELEASE_TEMP_ROOT/exochain-namespace-target" \
              CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false \
              EXOCHAIN_CRATES_IO_ALLOWED_OWNERS="$EXOCHAIN_CRATES_IO_ALLOWED_OWNERS" \
              TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "${fresh_path%%:*}/node" --input-type=module -
      - name: Package exact crate candidates without registry credentials
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          CDPATH: ""
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
