        run: /bin/bash --noprofile --norc -p tools/verify_release_tag.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          LD_PRELOAD: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          GLIBC_TUNABLES: ""
          GCONV_PATH: ""
          LOCPATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_EXTRA_CA_CERTS: ""
          OPENSSL_CONF: ""
        with:
