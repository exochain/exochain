<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IntelWar — constitutional arena and living strategic memory for rigorous intellectual combat."
    />
    <title>IntelWar.org — Mind War Theatre</title>
    <meta name="theme-color" content="#1f6b5a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var h = (location.hostname || "").toLowerCase();
        var title = "IntelWar.org — Mind War Theatre";
        if (h === "intelwar.org" || h === "www.intelwar.org") {
          title = "IntelWar.org — Mind War Theatre";
        } else if (h === "intelwar.press" || h === "www.intelwar.press") {
          title = "IntelWar.press — Fourth Estate";
        } else if (h === "intelwar.net" || h === "www.intelwar.net") {
          title = "IntelWar.net — Social + Living Log";
        } else if (h === "intelwar.ai" || h === "www.intelwar.ai") {
          title = "IntelWar.ai — Adversarial Intelligence";
        } else if (h === "intelwar.tv" || h === "www.intelwar.tv") {
          title = "IntelWar.tv — Filmstrip Theatre";
        }
        document.title = title;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
